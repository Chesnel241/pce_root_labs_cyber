# =============================================================================
# Traefik — configuration statique (PCE Root Labs Cyber)
# -----------------------------------------------------------------------------
# Reverse proxy + terminaison TLS (Let's Encrypt). La configuration dynamique
# (middlewares, routeurs déclaratifs) vit dans dynamic.yml et via les labels
# Docker des services (voir docker-compose.yml).
# =============================================================================

api:
  dashboard: true
  insecure: false # tableau de bord exposé uniquement via un routeur sécurisé.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false # n'expose que les services explicitement labellisés.
    network: pce-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # Renseignez une adresse réelle via la variable d'env ACME_EMAIL
      # (substituée dans le compose) ou éditez ici.
      email: "admin@example.com"
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
