# =============================================================================
# Traefik — configuration statique (PCE Root Labs Cyber)
# -----------------------------------------------------------------------------
# Reverse proxy + terminaison TLS (Let's Encrypt). La configuration dynamique
# (middlewares, routeurs déclaratifs) vit dans dynamic.yml et via les labels
# Docker des services (voir docker-compose.yml).
# =============================================================================

api:
  dashboard: true
  insecure: false # tableau de bord exposé uniquement via un routeur sécurisé.

# Endpoint /ping interne utilisé par le HEALTHCHECK du conteneur
# (`traefik healthcheck --ping`). N'est pas exposé publiquement.
ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false # n'expose que les services explicitement labellisés.
    network: pce-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # IMPORTANT : Traefik ne substitue PAS ${ACME_EMAIL} dans ce fichier YAML
      # statique. Renseignez ici une adresse RÉELLE avant le premier démarrage,
      # ou surchargez-la via l'argument CLI / variable d'environnement Traefik :
      #   --certificatesresolvers.letsencrypt.acme.email=$ACME_EMAIL
      # Une adresse valide est requise par Let's Encrypt (notifications d'expiration).
      email: "admin@example.com"
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
